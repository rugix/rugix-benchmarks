worker_processes 1;
pid /run/bench/nginx.pid;
error_log /root/bench-output/nginx-error.log info;
events { worker_connections 256; }
http {
    log_format bench escape=json '{"time":"$msec","duration":"$request_time","connection":"$connection","connection_requests":"$connection_requests","protocol":"$server_protocol","http2":"$http2","tls":"$ssl_protocol","method":"$request_method","uri":"$request_uri","range":"$http_range","status":"$status","body_bytes":"$body_bytes_sent","request_bytes":"$request_length","response_range":"$sent_http_content_range","response_length":"$sent_http_content_length"}';
    access_log /root/bench-output/nginx-access.jsonl bench;
    keepalive_timeout 60;
    keepalive_requests 100000;
    keepalive_time 1h;
    send_timeout 60;
    tcp_nodelay on;
    gzip off;
    default_type application/octet-stream;
    root /srv/bench;
    ssl_certificate /etc/nginx/bench.crt;
    ssl_certificate_key /etc/nginx/bench.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server { listen 10.0.3.2:8080; }
    server { listen 10.0.3.2:8443 ssl; }
    server { listen 10.0.3.2:8444 ssl; http2 on; }
}
