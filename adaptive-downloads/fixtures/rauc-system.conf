[system]
compatible=rugix-benchmarks
bootloader=grub
grubenv=/run/rugix/mounts/config/rauc.grubenv
bundle-formats=verity
data-directory=/root/rauc-corpus-data
activate-installed=false
[keyring]
path=/etc/rauc/ca.cert.pem
check-purpose=codesign
[slot.rootfs.0]
device=/dev/vda4
type=ext4
bootname=A
[slot.rootfs.1]
device=/dev/vda5
type=ext4
bootname=B
[slot.data.0]
device=/dev/vdb1
type=raw
parent=rootfs.0
[slot.data.1]
device=/dev/vdb2
type=raw
parent=rootfs.1
